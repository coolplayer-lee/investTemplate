capital_market_nutrient_test:
  full_test_required: false
  classification: 相互供养
  classification_basis: 上市以来（2001年H股IPO后）无再融资、股本从未扩张（2,926,209,589股不变）；年度分红持续且FY2025末期0.276元/股（派息率约34.5%，政策目标为母公司利润35%-45%）；但留存利润大量沉淀为结构性存款/理财60.20亿及参股投资（中航鑫港担保13.26%等，其他权益工具投资+375.5M），增量资本回报率低，属于分红有限但资本配置效率低的相互供养形态
  summary_source: 2026中报业绩公布：https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082400837_c.pdf
  historical_price_anchor_excluded: true
